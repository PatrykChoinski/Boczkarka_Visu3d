<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boczkarka Visu3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">Boczkarka profilowa <span class="muted">Visu3D</span></div>
    <div class="seg" id="mode">
      <button data-mode="offline" title="Offline – symulacja cyklu bez PLC">Offline</button>
      <button data-mode="online" title="Online – pozycje i stany z PLC (OPC UA)">Online</button>
    </div>
    <span class="chip" id="connChip" title="Połączenie z serwerem OPC UA">—</span>
    <div class="spacer"></div>
    <div class="seg" id="views">
      <button data-view="iso" title="Widok ogólny">Izo</button>
      <button data-view="front" title="Wzdłuż krawędzi">Przód</button>
      <button data-view="side" title="Przekrój profilu">Bok</button>
      <button data-view="top" title="Z góry">Góra</button>
      <button data-view="follow" title="Kamera podąża za głowicą">Śledź</button>
    </div>
  </header>
  <main>
    <div id="view"></div>
    <aside class="panel">
      <section class="card status">
        <h2>Stan</h2>
        <div class="kv"><span>Krok</span><b id="sStep">—</b></div>
        <div class="kv"><span>Przejście</span><b id="sPass">—</b></div>
        <div class="kv"><span>X</span><b id="sX">—</b></div>
        <div class="kv"><span>B</span><b id="sB">—</b></div>
        <div class="kv"><span>Wrzeciono</span><b id="sSpindle">—</b></div>
        <div class="kv"><span>Docisk / woda</span><b id="sMedia">—</b></div>
        <div class="kv"><span>Czas</span><b id="sTime">—</b></div>
        <div class="kv"><span>Licznik</span><b id="sCount">—</b></div>
        <div id="alarms" class="alarms"></div>
      </section>

      <section class="card">
        <h2>Przekrój krawędzi</h2>
        <svg id="section" viewBox="0 0 220 120" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="passes" class="passes"></div>
        <div class="row"><button id="newStone" title="Nowa, nieobrobiona płyta na widoku">Nowy kamień</button></div>
      </section>

      <section class="card" id="offlineCard">
        <h2>Symulacja (offline)</h2>
        <label>Receptura <select id="recipe"></select></label>
        <label>Rodzaj <select id="kind"></select></label>
        <div class="grid2">
          <label>X start [mm]<input id="xStart" type="number" step="10"></label>
          <label>X koniec [mm]<input id="xEnd" type="number" step="10"></label>
          <label>Naddatek [mm]<input id="overtravel" type="number" step="5"></label>
          <label>Posuw [m/min]<input id="feed" type="number" step="0.1"></label>
          <label>Obroty [Hz]<input id="spindleFrequency" type="number" step="1"></label>
          <label>Powtórzenia<input id="repeats" type="number" min="1" step="1"></label>
          <label class="chamfer">Kąt fazy [°]<input id="angle" type="number" step="5"></label>
          <label class="round">Kąt od [°]<input id="angleStart" type="number" step="5"></label>
          <label class="round">Kąt do [°]<input id="angleEnd" type="number" step="5"></label>
          <label class="round">Krok kąta [°]<input id="angleStep" type="number" step="1"></label>
        </div>
        <label class="check"><input id="bothDirections" type="checkbox"> Przejścia w obie strony</label>
        <div class="row">
          <label class="inline">Tempo <select id="speed"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>30</option></select>×</label>
        </div>
        <div class="row buttons">
          <button id="simStart" class="go">START</button>
          <button id="simPause">PAUZA</button>
          <button id="simStop" class="stop">STOP</button>
          <button id="simAck" title="Potwierdzenie po STOP / błędzie receptury">Kasuj</button>
        </div>
        <div id="simMsg" class="msg"></div>
      </section>

      <section class="card" id="onlineCard">
        <h2>PLC (online)</h2>
        <form id="connForm" class="conn">
          <label>Adres IP serwera OPC UA<input id="plcHost" placeholder="192.168.1.10" autocomplete="off"></label>
          <label>Port<input id="plcPort" type="number" value="4840"></label>
          <div class="row buttons">
            <button type="submit" class="go">Połącz</button>
            <button type="button" id="connDefault" title="Adres z config.json">Domyślny</button>
          </div>
        </form>
        <div id="connInfo" class="msg"></div>
        <div id="plcControls" class="row buttons" hidden>
          <button data-write="EdgeProfile.Start" class="go">START</button>
          <button data-write="EdgeProfile.Pause">PAUZA</button>
          <button data-write="EdgeProfile.Stop" class="stop">STOP</button>
          <button data-write="Alarms.Reset">Reset alarmów</button>
        </div>
        <div id="plcModes" class="seg wide" hidden>
          <button data-modereq="0">Ręczny</button>
          <button data-modereq="1">Bazowanie</button>
          <button data-modereq="2">Automat</button>
        </div>
        <div id="pageUrls" class="msg muted"></div>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
