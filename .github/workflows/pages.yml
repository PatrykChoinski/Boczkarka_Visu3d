# GitHub Pages: wersja statyczna Visu3D (tylko tryb offline, bez PLC) pod https://<konto>.github.io/<repo>/
# Po kazdym pushu do master: testy, budowa (scripts/build-pages.js -> site/), publikacja.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22    # node --test z wzorcem "test/*.test.js" wymaga Node >= 21
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-pages.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
